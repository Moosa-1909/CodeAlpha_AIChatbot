<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeAlpha AI Chatbot</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1e21; --muted:#6b7280; --bot:#eceef1; --user:#2563eb; --border:#e1e4e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --bot:#262a33; --user:#3b82f6; --border:#2a2e37; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text);
         height:100vh; display:flex; justify-content:center; align-items:center; }
  .chat { width:100%; max-width:640px; height:min(92vh,720px); background:var(--card); border:1px solid var(--border);
          border-radius:16px; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:16px 20px; border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; font-size:13px; color:var(--muted); }
  #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.45; font-size:15px; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; }
  .user { background:var(--user); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 10px; }
  .chip { border:1px solid var(--border); background:transparent; color:var(--text); padding:6px 12px; border-radius:999px; font-size:13px; cursor:pointer; }
  .chip:hover { background:var(--bot); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
  input { flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; outline:none; }
  input:focus { border-color:var(--user); }
  button.send { padding:0 18px; border:none; border-radius:10px; background:var(--user); color:#fff; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
<div class="chat">
  <header>
    <h1>🤖 CodeAlpha AI Chatbot</h1>
    <p>Ask about Java, OOP or the internship. Teach me with <code>teach: question =&gt; answer</code></p>
  </header>
  <div id="messages"></div>
  <div class="chips" id="chips"></div>
  <form id="form" autocomplete="off">
    <input id="input" placeholder="Type a message..." autofocus>
    <button class="send" type="submit">Send</button>
  </form>
</div>
<script>
  const sid = Math.random().toString(36).slice(2);
  const box = document.getElementById('messages');
  const input = document.getElementById('input');

  function add(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;          // textContent prevents HTML injection
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }

  async function send(text) {
    text = text.trim();
    if (!text) return;
    add(text, 'user');
    try {
      const res = await fetch('/chat', { method: 'POST', headers: { 'X-Session': sid }, body: text });
      add(await res.text(), 'bot');
    } catch (e) {
      add('Could not reach the server. Is it still running?', 'bot');
    }
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const t = input.value;
    input.value = '';
    send(t);
  });

  ['What is OOP?', 'How do I submit my task?', 'Difference between JDK and JRE', 'How do you work?'].forEach(q => {
    const c = document.createElement('button');
    c.className = 'chip';
    c.type = 'button';
    c.textContent = q;
    c.onclick = () => send(q);
    document.getElementById('chips').appendChild(c);
  });

  add("Hi! I'm a Java chatbot built with TF-IDF and cosine similarity. Ask me something, or type 'help'.", 'bot');
</script>
</body>
</html>
